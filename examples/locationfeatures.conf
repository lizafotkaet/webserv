server {
    listen 8080;
    root www;

    location / {
        allow_methods GET;
        index index.html;
    }

    location /old {
        return 301 /new;
    }

    location /files {
        allow_methods GET;
        autoindex on;
    }

    location /upload {
        allow_methods POST DELETE;
        upload_store www/uploads;
        client_max_body_size 10M;
    }

    location /cgi-bin {
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
    }
}