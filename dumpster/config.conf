# ============================================================================
#  webserv — test configuration (no CGI)
# ----------------------------------------------------------------------------
#  Expected directory layout (relative to where you launch ./webserv):
#
#    www/
#    ├── index.html
#    ├── about.html
#    ├── errors/
#    │   ├── 404.html
#    │   ├── 405.html
#    │   ├── 413.html
#    │   └── 500.html
#    ├── files/            (a few random files, autoindex ON here)
#    ├── private/          (no index file, autoindex OFF -> expect 403/404)
#    ├── uploads/          (must exist and be writable)
#    └── site2/
#        └── index.html
#
#  Covers: multiple servers, multiple ports, same port + different
#  server_name, default error pages, body size limit, allowed methods per
#  route, redirections, root per route, autoindex, default index file,
#  file uploads, DELETE.
# ============================================================================


# ----------------------------------------------------------------------------
# Server 1 — main test server
# ----------------------------------------------------------------------------
server {
    listen                  8080;
    host                    127.0.0.1;
    server_name             localhost webserv.local;

    root                    ./www;
    index                   index.html;

    client_max_body_size    1M;

    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;

    # Basic static site — GET only
    location / {
        allow_methods       GET;
        autoindex           off;
        index               index.html;
    }

    # Directory listing enabled
    #   curl http://localhost:8080/files/
    location /files {
        allow_methods       GET;
        autoindex           on;
    }

    # Directory with no index and no autoindex
    #   curl -i http://localhost:8080/private/   -> 403 (or 404, per your choice)
    location /private {
        allow_methods       GET;
        autoindex           off;
    }

    # Uploads: POST to create, DELETE to remove, GET to fetch
    #   curl -i -X POST -F "file=@test.txt" http://localhost:8080/uploads
    #   curl -i -X POST --data-binary @test.txt http://localhost:8080/uploads/test.txt
    #   curl -i http://localhost:8080/uploads/test.txt
    #   curl -i -X DELETE http://localhost:8080/uploads/test.txt
    location /uploads {
        allow_methods       GET POST DELETE;
        autoindex           on;
        upload_store        ./www/uploads;
        client_max_body_size 10M;      # route override (if you support it)
    }

    # Method not allowed test
    #   curl -i -X POST   http://localhost:8080/readonly  -> 405
    #   curl -i -X DELETE http://localhost:8080/readonly  -> 405
    location /readonly {
        allow_methods       GET;
        root                ./www;
        index               about.html;
    }

    # Route mapped to another root
    #   GET /alias/index.html -> ./www/site2/index.html
    location /alias {
        allow_methods       GET;
        root                ./www/site2;
        index               index.html;
    }

    # HTTP redirections
    #   curl -i http://localhost:8080/old        -> 301 Location: /
    #   curl -i http://localhost:8080/google     -> 302 Location: https://www.google.com
    location /old {
        return 301 /;
    }

    location /google {
        return 302 https://www.google.com;
    }
}


# ----------------------------------------------------------------------------
# Server 2 — same port, different server_name (virtual host)
#   curl -i --resolve site2.local:8080:127.0.0.1 http://site2.local:8080/
#   curl -i -H "Host: site2.local" http://localhost:8080/
# ----------------------------------------------------------------------------
server {
    listen                  8080;
    host                    127.0.0.1;
    server_name             site2.local;

    root                    ./www/site2;
    index                   index.html;

    client_max_body_size    1M;

    error_page 404 /errors/404.html;

    location / {
        allow_methods       GET;
        autoindex           off;
    }
}


# ----------------------------------------------------------------------------
# Server 3 — different port, tiny body limit, no custom error pages
#   (tests that your built-in default error pages work)
#
#   curl -i http://localhost:8081/doesnotexist                 -> default 404
#   curl -i -X POST -d "$(head -c 200 /dev/zero | tr '\0' a)" \
#        http://localhost:8081/upload                          -> 413
# ----------------------------------------------------------------------------
server {
    listen                  8081;
    host                    127.0.0.1;
    server_name             tiny;

    root                    ./www;
    index                   index.html;

    client_max_body_size    100;

    location / {
        allow_methods       GET;
    }

    location /upload {
        allow_methods       POST;
        upload_store        ./www/uploads;
    }
}


# ----------------------------------------------------------------------------
# Server 4 — third port, all methods on root, autoindex at root
#   curl -i http://localhost:8082/
#   curl -i -X DELETE http://localhost:8082/uploads/test.txt
# ----------------------------------------------------------------------------
server {
    listen                  8082;
    host                    127.0.0.1;
    server_name             open;

    root                    ./www;
    client_max_body_size    5M;

    error_page 404 /errors/404.html;

    location / {
        allow_methods       GET POST DELETE;
        autoindex           on;
        upload_store        ./www/uploads;
    }
}
